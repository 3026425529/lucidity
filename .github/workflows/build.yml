name: Lucidity 26.3 build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port workspace
        uses: actions/checkout@v4

      - name: Fetch upstream source
        run: git clone --depth 1 https://github.com/hotpad100c/lucidity2.0.git source

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: source/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare standalone 26.3 project
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          nl = chr(10)

          (root / 'settings.gradle.kts').write_text(nl.join([
              'pluginManagement {',
              '    repositories {',
              '        maven("https://maven.fabricmc.net/")',
              '        gradlePluginPortal()',
              '        mavenCentral()',
              '    }',
              '}',
              'rootProject.name = "lucidity"',
          ]) + nl)

          (root / 'gradle/wrapper/gradle-wrapper.properties').write_text(
              (root / 'gradle/wrapper/gradle-wrapper.properties').read_text().replace(
                  'gradle-9.2.0-bin.zip', 'gradle-9.7.1-bin.zip'))

          build_lines = [
              'plugins {',
              '    id("net.fabricmc.fabric-loom") version "1.18-SNAPSHOT"',
              '}',
              'group = "ml.mypals"',
              'version = "2.0.2+26.3"',
              'base.archivesName.set("lucidity")',
              '',
              'repositories {',
              '    maven("https://maven.fabricmc.net/")',
              '    maven("https://api.modrinth.com/maven")',
              '    maven("https://maven.terraformersmc.com/releases/")',
              '    maven("https://masa.dy.fi/maven")',
              '    mavenCentral()',
              '}',
              '',
              'dependencies {',
              '    minecraft("com.mojang:minecraft:26.3")',
              '    modImplementation("net.fabricmc:fabric-loader:0.19.5")',
              '    modImplementation("net.fabricmc.fabric-api:fabric-api:0.163.0+26.3")',
              '    modCompileOnly("com.terraformersmc:modmenu:21.0.0")',
              '    modImplementation("io.github.hotpad100c:ryansrenderingkit:1.3.2+26.3")',
              '    modCompileOnly("maven.modrinth:sodium:mc26.3-0.9.2-fabric")',
              '    modImplementation("com.github.sakura-ryoko:malilib:26.3-0.30.2")',
              '}',
              '',
              'loom {',
              '    accessWidenerPath = file("src/main/resources/accesswideners/26.3.accesswidener")',
              '}',
              '',
              'java {',
              '    toolchain.languageVersion.set(JavaLanguageVersion.of(25))',
              '    withSourcesJar()',
              '}',
              '',
              'tasks.processResources {',
              '    inputs.property("version", project.version)',
              '    inputs.property("minecraft", "26.3")',
              '    filesMatching("fabric.mod.json") {',
              '        expand("id" to "lucidity", "name" to "Lucidity", "version" to project.version, "minecraft" to "26.3", "aw_file" to "26.3.accesswidener")',
              '    }',
              '    filesMatching("*.mixins.json") { expand("java" to "JAVA_25") }',
              '}',
          ]
          (root / 'build.gradle.kts').write_text(nl.join(build_lines) + nl)
          (root / 'src/main/resources/accesswideners/26.3.accesswidener').write_text('accessWidener v2 named' + nl)
          print('Prepared standalone mappings-less 26.3 project')
          PY

      - name: Build 26.3 jar
        working-directory: source
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucidity-26.3-build
          path: |
            source/build/libs/**/*.jar
            source/build/reports/**
          if-no-files-found: warn
