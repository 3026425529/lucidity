name: Lucidity 26.3 build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port workspace
        uses: actions/checkout@v4

      - name: Fetch upstream source
        run: git clone --depth 1 https://github.com/hotpad100c/lucidity2.0.git source

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: source/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare 26.3 project
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          nl = chr(10)

          settings_path = root / 'settings.gradle.kts'
          lines = settings_path.read_text().splitlines()
          for i, line in enumerate(lines):
              if '"1.21.9"' in line and i + 1 < len(lines) and lines[i + 1].strip() == ')':
                  lines[i] = line.rstrip() + ','
                  lines.insert(i + 1, '            "26.3"')
                  break
          settings = nl.join(lines) + nl
          settings = settings.replace('vcsVersion = "1.21.4"', 'vcsVersion = "26.3"')
          settings_path.write_text(settings)

          stone_path = root / 'stonecutter.gradle.kts'
          stone = stone_path.read_text()
          stone = stone.replace('id("fabric-loom") version "1.14.10"', 'id("fabric-loom") version "1.18-SNAPSHOT"')
          stone = stone.replace('stonecutter active "1.21.9"', 'stonecutter active "26.3"')
          stone_path.write_text(stone)

          wrapper = root / 'gradle/wrapper/gradle-wrapper.properties'
          wrapper.write_text(wrapper.read_text().replace('gradle-9.2.0-bin.zip', 'gradle-9.7.1-bin.zip'))

          build_path = root / 'build.gradle.kts'
          build = build_path.read_text()
          build = build.replace('val requiredJava = when {', 'val requiredJava = when {' + nl + '    stonecutter.eval(stonecutter.current.version, ">=26.1") -> JavaVersion.VERSION_25')
          build = build.replace('stonecutter.eval(minecraft, ">=1.21.9") -> "1.21.9.accesswidener"', 'stonecutter.eval(minecraft, ">=26.1") -> "26.3.accesswidener"' + nl + '    stonecutter.eval(minecraft, ">=1.21.9") -> "1.21.9.accesswidener"')
          build_path.write_text(build)

          version_dir = root / 'versions/26.3'
          version_dir.mkdir(parents=True, exist_ok=True)
          props = [
              'deps.fabric_loader=0.19.5',
              'deps.fabric_api=0.163.0+26.3',
              'mod.mc_title=26.3',
              'mod.mc_targets=26.3',
              'mod.mc_dep=26.3',
              'deps.mod_menu_version=21.0.0',
              'deps.ryansrenderingkit_version=1.3.2+26.3',
              'deps.sodium_version=mc26.3-0.9.2-fabric',
              'deps.malilib_version=26.3-0.30.2',
          ]
          (version_dir / 'gradle.properties').write_text(nl.join(props) + nl)
          (version_dir / 'src/main').mkdir(parents=True, exist_ok=True)
          (root / 'src/main/resources/accesswideners/26.3.accesswidener').write_text('accessWidener v2 named' + nl)
          print('Prepared 26.3 scaffold')
          PY

      - name: Build 26.3 jar
        working-directory: source
        run: chmod +x gradlew && ./gradlew :26.3:build --no-daemon --stacktrace

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucidity-26.3-build
          path: |
            source/**/build/libs/**/*.jar
            source/**/build/reports/**
          if-no-files-found: warn
