name: clone-test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/hotpad100c/lucidity2.0.git source
      - name: Inspect source
        run: |
          test -f source/gradlew
          git -C source log -1 --oneline
          java -version
